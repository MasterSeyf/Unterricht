/* V04: kompakter Buchstabenformenblock und erweiterte Karteikartenfilter */
.brand-link{color:inherit;text-decoration:none;min-width:0;border-radius:12px;padding:2px 5px 2px 0;transition:opacity .18s,outline-color .18s}
.brand-link:hover{color:inherit;opacity:.9}
.brand-link:focus-visible{outline:2px solid #e4b56d;outline-offset:5px}
.brand-copy{display:block;min-width:0}
.brand small{text-transform:none;letter-spacing:.3px;font-size:12px}
.brand h1{font-size:17px}
.letter{position:relative;min-height:112px;padding:30px 7px 8px}
.letter-symbols{position:absolute;top:6px;left:7px;right:7px;display:flex;justify-content:space-between;align-items:center;direction:ltr;pointer-events:none}
.letter-symbol{width:22px;height:22px;flex:0 0 22px;display:grid;place-items:center;border-radius:6px;font-size:14px;line-height:1;font-weight:800;border:1px solid transparent}
.letter-symbol.sun{background:#fbf0dc;color:#875b1d;border-color:#f0ddb9}
.letter-symbol.moon{background:#e8eef2;color:#3b5c70;border-color:#d6e0e7}
.letter-symbol.join{background:#e2f0ec;color:#155b50;border-color:#c9e3d9;font-size:17px}
.letter-symbol.no-join{background:#f7e9e5;color:#88443b;border-color:#efd5cf;font-size:16px}
.letter .glyph{margin-top:1px}
.trainer-toolbar{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:14px 0}
.trainer-filter{flex:1 1 280px;min-width:220px}
.trainer-filter label,.trainer-order-control>span{display:block;font-size:11px;font-weight:800;color:var(--muted);margin:0 0 6px}
.trainer-order-control{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.trainer-order-control>span{width:100%;margin-bottom:-1px}
.trainer-order-buttons{display:flex;gap:6px;flex-wrap:wrap}
.trainer-order-buttons .btn{padding:9px 12px;font-size:12px}
.shuffle-again{padding:9px 12px;font-size:12px}
.trainer-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 9px}
.trainer-stat{background:#fffefa;border:1px solid var(--line);border-radius:13px;padding:13px 14px;min-width:0}
.trainer-stat>span{display:block;color:var(--muted);font-size:11px;font-weight:750}
.trainer-stat strong{display:block;font-size:25px;line-height:1.25;margin:4px 0 2px;letter-spacing:-.5px}
.trainer-stat strong small{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
.trainer-stat em{display:block;font-size:10px;color:var(--muted);font-style:normal;line-height:1.35}
.trainer-stat.mastered strong{color:#287553}
.trainer-stat.repeat strong{color:#a06b21}
.trainer-stat.fresh strong{color:#62747b}
.trainer-stat.assessed strong{color:#276a68}
.trainer-progress-wrap{background:#fffefa;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:9px 0 13px}
.trainer-progress{height:10px;border-radius:99px;background:#edf0ea;overflow:hidden;display:flex}
.trainer-progress .known-segment{background:#4f9874}
.trainer-progress .review-segment{background:#d9a34c}
.trainer-progress-legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:10px}
.trainer-progress-legend span{display:inline-flex;align-items:center;gap:5px}
.trainer-progress-legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.known-dot{background:#4f9874}.review-dot{background:#d9a34c}.fresh-dot{background:#c8d0ca}
.trainer-session{display:flex;align-items:center;gap:8px 15px;flex-wrap:wrap;background:#eef3ef;border:1px solid #dce7dd;border-radius:11px;padding:9px 12px;margin:0 0 14px;color:#52656a;font-size:11px}
.trainer-session b{color:#244b4e}
.trainer-meta{margin:0 auto 0;}
.flash-actions .btn{min-width:126px}
@media(max-width:850px){.trainer-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.trainer-toolbar{align-items:stretch}.trainer-order-control{width:100%}.trainer-order-buttons{flex:1}.trainer-order-buttons .btn{flex:1}.shuffle-again{flex:0 0 auto}.trainer-stats{gap:7px}.trainer-stat{padding:11px}.trainer-stat strong{font-size:22px}.trainer-session{gap:6px 10px}.letter{min-height:100px}.letter-symbol{width:20px;height:20px;flex-basis:20px}.letter-symbols{left:5px;right:5px;top:5px}}

/* V04: kompakter Buchstabenformenblock und klare, stabile Filter-/Aktionssteuerung */
.letter-detail{padding:12px 17px}
.letter-meta-row{margin-bottom:2px}
.forms-layout{margin-top:0}
.isolated-form{margin-bottom:3px}
.forms-layout>.letter-detail-flags{justify-content:center;margin:2px 0 5px}
.trainer-toolbar{align-items:end}
.trainer-order-control{display:block;min-width:min(100%,360px)}
.trainer-order-control>span{width:auto;margin:0 0 6px}
.trainer-order-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.trainer-order-buttons .btn{width:100%;min-width:0;height:38px;padding:7px 5px;font-size:12px;white-space:nowrap;display:flex;align-items:center;justify-content:center;transform:none}
.trainer-order-buttons .btn:hover{transform:none}

/* V05 Feinschliff: Kennzeichnung links oben, isolierte Form mittig direkt am oberen Rand */
.alphabet-letter-detail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:8px;row-gap:4px;align-items:start;padding:14px 14px 10px}

<script>
'use strict';
const STORE='salam-lab-progress-v1';
const defaultState={completed:[],known:[],review:[],notes:{},scores:{},lastLesson:1};
let state;
try{state={...defaultState,...JSON.parse(localStorage.getItem(STORE)||'{}')};state.known=Array.isArray(state.known)?state.known:[];state.review=Array.isArray(state.review)?state.review:[];}catch(e){state={...defaultState};}
let view='home', currentLesson=1, lessonTab='overview', trainerFilter='all', trainerScope='all', trainerIndex=0, trainerFlipped=false, trainerOrder='source', trainerShuffleIds=[], trainerSession={seen:new Set(),decisions:new Map(),total:0}, quizGroup='all', quizAnswers={}, quizChecked=false, alphabetSelected='ا', vocabSearch='';
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const lessons=[
{id:1,title:'Begrüßen & sich vorstellen',page:'12–25',unit:'1–5',level:'A1',goals:['Grüßen und sich verabschieden','Den eigenen Namen nennen und nach dem Namen fragen','Herkunft und Wohnort mit einfachen Sätzen angeben','Von 0 bis 10 zählen'],grammar:[['Personalpronomen: ich und du','Die Personalpronomen stehen im Arabischen häufig nicht ausdrücklich vor dem Verb, weil die Verbform die Person erkennen lässt. Für nominale Sätze sind sie besonders nützlich.','أنا من ألمانيا.','anā min almānyā','Ich komme aus Deutschland.'],['Possessivendungen','Besitz wird an das Substantiv angehängt. Die Endung richtet sich nach der besitzenden Person: ـي „mein“, ـكَ „dein“ (m.), ـكِ „dein“ (f.).','اسمي سامي.','ismī Sāmī','Mein Name ist Sami.'],['Nominaler Satz','Ein einfacher nominaler Satz braucht im Präsens normalerweise kein ausgesprochenes „sein“. Das Prädikat folgt dem Thema: „Ich (bin) …“.','أنا طالب.','anā ṭālib','Ich bin Student.'],['Fragepartikel und Fragewörter','هل leitet eine Ja/Nein-Frage ein. Fragewörter wie من „wer“ und أين „wo“ stehen meist am Satzanfang.','هل أنت من برلين؟','hal anta min Berlīn?','Kommst du aus Berlin?']],phrases:[['مرحباً','marḥaban','Hallo!'],['السلام عليكم','as-salāmu ʿalaykum','Friede sei mit euch. / Guten Tag.'],['وعليكم السلام','wa-ʿalaykumu s-salām','Und mit euch sei Friede. (Antwort)'],['اسمي ليلى.','ismī Laylā.','Ich heiße Layla.'],['من أين أنت؟','min ayna anta?','Woher kommst du? (zu einem Mann)'],['أنا من ألمانيا.','anā min almānyā.','Ich komme aus Deutschland.']],vocab:[['Hallo','مرحباً','marḥaban'],['Name','اسم','ism'],['Land','بلد','balad'],['Deutschland','ألمانيا','almānyā'],['ich','أنا','anā'],['du (m.)','أنتَ','anta'],['du (f.)','أنتِ','anti']],culture:'Die arabische Schrift ist eine verbundene Schrift. Die Form vieler Buchstaben verändert sich je nachdem, ob sie allein, am Wortanfang, in der Mitte oder am Ende stehen.',quiz:[['Wie fragst du „Woher kommst du?“ zu einem Mann?',['من أين أنت؟','كم عمرك؟','ما اسمك؟'],0,'من أين = „von wo“; أنتَ = „du“ (m.).'],['Welche Endung bedeutet „mein“ bei اسم?',['ـكَ','ـي','ـها'],1,'اسمي = اسم + ي, also „mein Name“.']]},
{id:2,title:'Befinden, Höflichkeit & Telefon',page:'26–37',unit:'1–5',level:'A1',goals:['Nach dem Befinden fragen und darauf antworten','Sich entschuldigen und bedanken','Eine andere Person vorstellen','Einfache Telefonsituationen bewältigen'],grammar:[['Fragewörter','كيف fragt nach dem Wie; ما / ماذا nach dem Was; من nach Personen. Die passende Form von „du“ kann männlich oder weiblich sein.','كيف حالك؟','kayfa ḥāluka?','Wie geht es dir? (zu einem Mann)'],['Bestimmtheit mit ال','Der bestimmte Artikel ال steht vor dem Substantiv. Einen unbestimmten Artikel wie „ein/eine“ gibt es nicht als eigenes Wort.','الكتاب جديد.','al-kitāb jadīd.','Das Buch ist neu.'],['Pronomen und Besitz: er/sie','Für die 3. Person Singular stehen هو „er“ und هي „sie“. Die Possessivendungen ـهُ und ـها bedeuten „sein“ und „ihr“.','هذا هاتفها.','hādhā hātifuhā.','Das ist ihr Telefon.']],phrases:[['كيف حالك؟','kayfa ḥāluka?','Wie geht es dir? (m.)'],['أنا بخير، شكراً.','anā biḫayr, šukran.','Mir geht es gut, danke.'],['آسف. / آسفة.','āsif / āsifa.','Entschuldigung. (m. / f.)'],['شكراً جزيلاً.','šukran jazīlan.','Vielen Dank.'],['هذا صديقي.','hādhā ṣadīqī.','Das ist mein Freund.']],vocab:[['Befinden','حال','ḥāl'],['gut','بخير','biḫayr'],['Danke','شكراً','šukran'],['Entschuldigung (m.)','آسف','āsif'],['Freund','صديق','ṣadīq'],['Telefon','هاتف','hātif'],['Familie','عائلة','ʿāʾila']],culture:'Das Buch stellt die semitischen Sprachen vor. Arabisch gehört zu dieser Sprachfamilie; Wortwurzeln und wiederkehrende Konsonantenmuster sind ein wichtiges Merkmal vieler semitischer Sprachen.',quiz:[['Was bedeutet كيف؟',['Wo?','Wie?','Wer?'],1,'كيف = „wie“.'],['Welche Endung bedeutet „ihr“ bei هاتف?',['ـها','ـي','ـنا'],0,'هاتفها = ihr Telefon.']]},
{id:3,title:'Länder, Sprachen & Herkunft',page:'38–49',unit:'1–5',level:'A1',goals:['Staatsangehörigkeit und Herkunft erfragen','Jemanden vorstellen','Nach Sprachkenntnissen fragen','Einfache Aussagen über Sprachen machen'],grammar:[['Femininendung ـة','Viele feminine Substantive und Adjektive enden auf ة (tāʾ marbūṭa). Bei Nationalitätsbezeichnungen steht häufig eine feminine Form auf ـية. Es gibt Ausnahmen.','ألمانيّ / ألمانيّة','almānī / almāniyya','deutsch (m. / f.)'],['Imperfekt: Präsens Singular','Das Imperfekt bezeichnet unter anderem Gegenwart und Gewohnheiten. Bei vielen regelmäßigen Verben zeigt ein Präfix die Person: أـ, تـ, يـ. Die genaue Vokalfolge hängt vom Verb ab.','أنا أتكلم العربية.','anā atakallamu l-ʿarabiyya.','Ich spreche Arabisch.'],['Personen beschreiben','Nationalität und Sprache werden häufig mit Adjektivformen bzw. Substantiven ausgedrückt. Achte auf die Übereinstimmung von Geschlecht und Form.','هي مصرية.','hiya miṣriyya.','Sie ist Ägypterin.']],phrases:[['ما جنسيتك؟','mā jinsiyyatuka?','Welche Staatsangehörigkeit hast du? (m.)'],['أنا ألماني. / أنا ألمانية.','anā almānī / almāniyya.','Ich bin Deutscher / Deutsche.'],['هل تتكلم العربية؟','hal tatakallamu l-ʿarabiyya?','Sprichst du Arabisch? (m.)'],['أتكلم قليلاً.',' atakallamu qalīlan.','Ich spreche ein wenig.'],['ما لغتك الأم؟','mā lughatuka l-umm?','Was ist deine Muttersprache? (m.)']],vocab:[['Sprache','لغة','luġa'],['Arabisch','العربية','al-ʿarabiyya'],['Nationalität','جنسية','jinsiyya'],['Ägypter','مصري','miṣrī'],['deutsch','ألماني','almānī'],['sprechen','تكلّم','takallama'],['Hauptstadt','عاصمة','ʿāṣima']],culture:'Arabisch ist nicht gleichbedeutend mit einer einzigen Alltagssprache: Neben dem modernen Hocharabisch gibt es regionale Dialekte. Das Buch greift diese Vielfalt in einer eigenen Kulturseite auf.',quiz:[['Was bedeutet لغة؟',['Sprache','Stadt','Beruf'],0,'لغة = Sprache.'],['Welche Form ist feminin?',['ألماني','ألمانية','ألمانيا'],1,'Die Form auf ـية ist hier die feminine Nationalitätsbezeichnung.']]},
{id:4,title:'Berufe & Arabisch lernen',page:'50–61',unit:'1–5',level:'A1',goals:['Nach dem Beruf fragen und ihn nennen','Nach einem unbekannten Wort fragen','Einen Lern- oder Beweggrund ausdrücken','Von 11 bis 20 zählen'],grammar:[['Konjunktionen','و verbindet Wörter oder Sätze mit „und“, أو bedeutet „oder“, لكن „aber“. لأنّ / لأنني führt eine Begründung ein („weil …“).','أتعلم العربية لأنني أحب اللغات.','ataʿallamu l-ʿarabiyya li-ʾannanī uḥibbu l-luġāt.','Ich lerne Arabisch, weil ich Sprachen mag.'],['Imperfekt im Singular','Viele Präsensformen beginnen mit أـ (ich), تـ (du/sie) oder يـ (er). Lerne neue Verben immer zusammen mit einer Beispielsatzform.','ماذا تعمل؟','mādhā taʿmal?','Was arbeitest du? / Was machst du beruflich?'],['Fragen nach Wörtern','ما معنى …؟ fragt nach der Bedeutung; كيف نقول …؟ fragt, wie man etwas sagt.','ما معنى هذه الكلمة؟','mā maʿnā hādhihi l-kalima?','Was bedeutet dieses Wort?']],phrases:[['ما مهنتك؟','mā mihnatuka?','Was ist dein Beruf? (m.)'],['أنا طالب. / أنا طالبة.','anā ṭālib / ṭāliba.','Ich bin Student / Studentin.'],['لماذا تتعلم العربية؟','limādhā tataʿallamu l-ʿarabiyya?','Warum lernst du Arabisch? (m.)'],['ما معنى هذه الكلمة؟','mā maʿnā hādhihi l-kalima?','Was bedeutet dieses Wort?'],['لأنني أحب اللغات.','li-ʾannanī uḥibbu l-luġāt.','Weil ich Sprachen mag.']],vocab:[['Beruf','مهنة','mihna'],['Arbeit','عمل','ʿamal'],['Student','طالب','ṭālib'],['Studentin','طالبة','ṭāliba'],['lernen','تعلّم','taʿallama'],['warum','لماذا','limādhā'],['Wort','كلمة','kalima']],culture:'Im Buch werden arabische und indische Zahlzeichen gegenübergestellt. Übe, beide Ziffernsysteme wiederzuerkennen; in Alltagstexten können unterschiedliche Schreibweisen begegnen.',quiz:[['Wie heißt „weil“ in لأنني؟',['und ich','weil ich','aber ich'],1,'لأنني bedeutet „weil ich …“.'],['Welche Form bedeutet „Studentin“?',['طالب','طالبة','مهنة'],1,'طالبة ist die feminine Form.']]},
{id:5,title:'Wohnen & Kontaktdaten',page:'62–73',unit:'1–5',level:'A1',goals:['Sagen, wo man wohnt','Telefonnummer und E-Mail-Adresse erfragen','Einfache persönliche Kontaktdaten austauschen','Zahlen und Mengen im Kontext verwenden'],grammar:[['Gebrochener Plural','Viele arabische Plurale entstehen durch eine Veränderung des Wortinneren statt durch eine angehängte Endung. Diese Formen sind oft nicht zuverlässig aus dem Singular ableitbar und sollten mitgelernt werden.','كتاب ← كتب','kitāb ← kutub','Buch → Bücher (Beispiel eines gebrochenen Plurals)'],['Zahlen 3–10','Bei den Zahlen 3 bis 10 steht das gezählte Substantiv grundsätzlich im Plural und im Genitiv. Die Zahl zeigt in der klassischen Regel ein Genus-Gegenspiel zum Substantiv.','ثلاثة كتب','thalāthatu kutubin','drei Bücher'],['Possessivendungen am Substantiv','Die Endung wird unmittelbar an das Substantiv angefügt. Vor ihr kann ein Verbindungslaut hörbar werden; in der vereinfachten Schreibpraxis wird dieser oft nicht ausgeschrieben.','بيتي','baytī','mein Haus']],phrases:[['أين تسكن؟','ayna taskunu?','Wo wohnst du? (m.)'],['أسكن في برلين.','askunu fī Berlīn.','Ich wohne in Berlin.'],['ما رقم هاتفك؟','mā raqmu hātifika?','Wie lautet deine Telefonnummer? (m.)'],['هذا بريدي الإلكتروني.','hādhā barīdī l-iliktrūnī.','Das ist meine E-Mail-Adresse.'],['كم عدد الغرف؟','kam ʿadadu l-ġuraf?','Wie viele Zimmer gibt es?']],vocab:[['Haus','بيت','bayt'],['wohnen','سكن','sakana'],['Telefonnummer','رقم الهاتف','raqmu l-hātif'],['E-Mail','بريد إلكتروني','barīd iliktrūnī'],['Zimmer','غرفة','ġurfa'],['Adresse','عنوان','ʿunwān'],['drei','ثلاثة','thalātha']],culture:'Die Lektion führt in die Vielfalt arabischer Dialekte ein. Für den Lernweg hier ist modernes Hocharabisch die gemeinsame Basis; regionale Umgangsformen können je nach Land abweichen.',quiz:[['Was bedeutet أسكن في ...؟',['Ich lerne ...','Ich wohne in ...','Ich arbeite bei ...'],1,'سكن bedeutet wohnen.'],['Wie lautet ein gebrochener Plural zu كتاب?',['كتابات','كتب','كتابون'],1,'كتب (kutub) ist ein gebrochener Plural.']]},
{id:6,title:'Gegenstände & kurze Nachrichten',page:'78–87',unit:'6–10',level:'A1–A2',goals:['Alltagsgegenstände benennen','Personen und Dinge lokalisieren','Einfache kurze Briefe oder E-Mails verstehen und formulieren','Besitz ausdrücken'],grammar:[['Demonstrativpronomen','هذا bezeichnet ein maskulines, هذه ein feminines Substantiv im Singular. Für Personen und Dinge im Plural gibt es weitere Formen; bei nichtmenschlichen Pluralen steht das begleitende Adjektiv häufig im Femininum Singular.','هذا قلم. / هذه حقيبة.','hādhā qalam / hādhihi ḥaqība','Das ist ein Stift. / Das ist eine Tasche.'],['Gesunder Plural','Der regelmäßige maskuline Plural wird häufig mit ـون / ـين gebildet, der feminine mit ـات. Welche Form im Satz steht, hängt auch von der Funktion und vom Fall ab.','معلمون','muʿallimūn','Lehrer (regelmäßiger maskuliner Plural)'],['„Haben“ mit عند','Arabisch hat kein direkt entsprechendes Vollverb „haben“ für einfache Besitzangaben. Eine gebräuchliche Konstruktion verwendet عند + Personenendung.','عندي كتاب.','ʿindī kitāb.','Ich habe ein Buch.']],phrases:[['ما هذا؟','mā hādhā?','Was ist das? (maskulin)'],['أين القلم؟','ayna l-qalam?','Wo ist der Stift?'],['الكتاب على الطاولة.','al-kitāb ʿalā ṭ-ṭāwila.','Das Buch liegt auf dem Tisch.'],['عندي هاتف.','ʿindī hātif.','Ich habe ein Telefon.'],['هذه رسالة قصيرة.','hādhihi risāla qaṣīra.','Das ist eine kurze Nachricht.']],vocab:[['Stift','قلم','qalam'],['Buch','كتاب','kitāb'],['Tisch','طاولة','ṭāwila'],['Tasche','حقيبة','ḥaqība'],['auf','على','ʿalā'],['unter','تحت','taḥt'],['Nachricht','رسالة','risāla']],culture:'Die Kulturseite widmet sich neuen Technologien. Nutze die Gelegenheit, auch moderne Lehn- und Fachwörter im arabischen Schriftbild zu erkennen.',quiz:[['Wie drückst du „Ich habe ein Buch“ aus?',['أنا كتاب','عندي كتاب','في كتابي'],1,'عندي = bei mir / ich habe.'],['Welche Form bedeutet „diese“?',['هذا','هذه','هؤلاء'],1,'هذه steht vor einem femininen Singular.']]},
{id:7,title:'Stadtzentrum & Wegbeschreibung',page:'88–97',unit:'6–10',level:'A1–A2',goals:['Das Stadtzentrum und Geschäfte beschreiben','Nach dem Weg fragen und einen Weg erklären','Orte räumlich einordnen','Sagen, was es an einem Ort gibt'],grammar:[['Ortspräpositionen und Ortsadverbien','Präpositionen wie في „in“, أمام „vor“, خلف „hinter“, بين „zwischen“ und بجانب „neben“ beschreiben Lage. Das Bezugswort folgt in der Regel im Genitiv.','المقهى أمام البنك.','al-maqhā amāma l-bank.','Das Café ist vor der Bank.'],['Adjektive und Übereinstimmung','Das Adjektiv steht gewöhnlich nach dem Substantiv. Es richtet sich nach Genus und Bestimmtheit; bei nichtmenschlichen Pluralen erscheint häufig ein feminines Singularadjektiv.','الشوارع واسعة.','aš-šawāriʿ wāsiʿa.','Die Straßen sind breit.'],['„Es gibt“','Für Existenzangaben werden unter anderem هناك („dort gibt es“) und يوجد / توجد („es gibt“) verwendet. Die Verbform richtet sich nach dem grammatischen Bezug.','يوجد متجر هنا.','yūjadu matjar hunā.','Hier gibt es ein Geschäft.']],phrases:[['أين السوق؟','ayna s-sūq?','Wo ist der Markt?'],['اذهب إلى اليمين.','idhhab ilā l-yamīn.','Gehen Sie nach rechts. (m.)'],['المقهى أمام البنك.','al-maqhā amāma l-bank.','Das Café liegt vor der Bank.'],['هل يوجد متجر قريب؟','hal yūjadu matjar qarīb?','Gibt es ein Geschäft in der Nähe?'],['امشِ إلى الأمام.','imši ilā l-amām.','Gehen Sie geradeaus. (m.)']],vocab:[['Stadt','مدينة','madīna'],['Straße','شارع','šāriʿ'],['Markt','سوق','sūq'],['Geschäft','متجر','matjar'],['rechts','يمين','yamīn'],['links','يسار','yasār'],['vor','أمام','amām']],culture:'Die Kulturseite behandelt arabische Städteplanung. Beim Beschreiben von Städten helfen Lagewörter und Ortspräpositionen, konkrete Wege und räumliche Beziehungen verständlich zu machen.',quiz:[['Was bedeutet أمام؟',['hinter','vor','zwischen'],1,'أمام = vor.'],['Wie kann „es gibt ein Geschäft“ heißen?',['يوجد متجر','أنا متجر','متجر إلى'],0,'يوجد wird in Existenzsätzen verwendet.']]},
{id:8,title:'Lebensmittel & Einkaufen',page:'98–107',unit:'6–10',level:'A1–A2',goals:['Lebensmittel benennen und einkaufen','Mengen und Preise erfragen','Einfache Kochschritte oder Rezepte beschreiben','Verabredungen treffen'],grammar:[['Die drei Fälle','Das Buch führt Nominativ, Genitiv und Akkusativ ein. Der Nominativ kennzeichnet unter anderem das Subjekt, der Genitiv steht nach Präpositionen und im zweiten Teil einer Genitivverbindung, der Akkusativ markiert häufig das direkte Objekt.','أشتري الخبز.','aštarī l-ḫubz.','Ich kaufe das Brot.'],['Genitivverbindung (iḍāfa)','Zwei Substantive können eine Zugehörigkeit ausdrücken: „X von Y“. Das erste Glied trägt keinen bestimmten Artikel; das zweite steht im Genitiv und bestimmt die ganze Verbindung.','باب البيت','bābu l-bayt','die Tür des Hauses'],['Bestimmtheit und Possessivformen','Ein Substantiv kann durch ال, einen Eigennamen, eine Possessivendung oder als erstes Glied einer Genitivverbindung bestimmt sein. Ein zugehöriges Adjektiv übernimmt die Bestimmtheit.','سعر التفاح','siʿru t-tuffāḥ','der Preis der Äpfel']],phrases:[['كم سعر هذا؟','kam siʿru hādhā?','Wie viel kostet das?'],['أريد كيلو من التفاح.','urīdu kīlū min at-tuffāḥ.','Ich möchte ein Kilo Äpfel.'],['أين الخضروات؟','ayna l-ḫuḍrawāt?','Wo ist das Gemüse?'],['الوصفة سهلة.','al-waṣfa sahla.','Das Rezept ist einfach.'],['هل نلتقي غداً؟','hal naltaqī ġadan?','Treffen wir uns morgen?']],vocab:[['Lebensmittel','طعام','ṭaʿām'],['Brot','خبز','ḫubz'],['Wasser','ماء','māʾ'],['Preis','سعر','siʿr'],['Kilo','كيلو','kīlū'],['Apfel','تفاح','tuffāḥ'],['Gemüse','خضروات','ḫuḍrawāt']],culture:'Die arabische Küche steht im Mittelpunkt der Kulturseite. Achte beim Wortschatz darauf, dass Mengenangaben, Lebensmittelbezeichnungen und höfliche Bitten gemeinsam in einer Einkaufssituation geübt werden.',quiz:[['Welcher Fall steht typischerweise nach einer Präposition?',['Nominativ','Genitiv','Akkusativ'],1,'Nach Präpositionen folgt im Arabischen der Genitiv.'],['Was bedeutet باب البيت؟',['Das Haus ist groß.','Die Tür des Hauses.','Ein Haus und eine Tür.'],1,'Die Genitivverbindung drückt Zugehörigkeit aus.']]},
{id:9,title:'Essen, Trinken & Zukunft',page:'108–117',unit:'6–10',level:'A1–A2',goals:['Im Restaurant Essen und Getränke bestellen','Bitten und etwas anbieten','Über zukünftige Vorhaben sprechen','Genitivverbindungen im Kontext anwenden'],grammar:[['Futur','Zukünftige Handlungen werden mit سـ oder سوف vor dem Imperfekt ausgedrückt. Die Verbform bleibt ein Imperfekt.','سوف أزور القاهرة.','sawfa azūru l-qāhira.','Ich werde Kairo besuchen.'],['Imperfekt im Plural','Die Personenformen im Plural werden unter anderem durch Präfixe und Endungen unterschieden. Lerne sie mit den Personalpronomen und konkreten Verben.','نحن نأكل هنا.','naḥnu naʾkulu hunā.','Wir essen hier.'],['Bitten und anbieten','Höflichkeit entsteht durch passende Frageformen, من فضلك („bitte“) und Wendungen wie هل تريد …؟ („Möchtest du …?“).','هل تريد الشاي؟','hal turīdu š-šāy?','Möchtest du Tee?']],phrases:[['ماذا تريد أن تشرب؟','mādhā turīdu an tašrab?','Was möchtest du trinken? (m.)'],['أريد ماءً من فضلك.','urīdu māʾan min faḍlik.','Ich möchte Wasser, bitte.'],['هل تريد الشاي؟','hal turīdu š-šāy?','Möchtest du Tee?'],['الحساب من فضلك.','al-ḥisāb min faḍlik.','Die Rechnung, bitte.'],['سوف نلتقي غداً.','sawfa naltaqī ġadan.','Wir werden uns morgen treffen.']],vocab:[['Restaurant','مطعم','maṭʿam'],['Speisekarte','قائمة الطعام','qāʾimat aṭ-ṭaʿām'],['essen','أكل','akala'],['trinken','شرب','šariba'],['Tee','شاي','šāy'],['Rechnung','حساب','ḥisāb'],['bitte','من فضلك','min faḍlik']],culture:'Die Lektion wird von einer Kulturseite zur arabischen Trinkkultur begleitet. Sprachlich stehen höfliche Angebote und Bestellungen im Vordergrund; kulturelle Praktiken können regional und individuell variieren.',quiz:[['Wie bildest du eine einfache Zukunftsform?',['سوف + Imperfekt','ال + Substantiv','لم + Perfekt'],0,'سوف bzw. سـ steht vor dem Imperfekt.'],['Was bedeutet الحساب من فضلك؟',['Die Speisekarte, bitte.','Die Rechnung, bitte.','Ein Wasser, bitte.'],1,'الحساب = die Rechnung.']]},
{id:10,title:'Familie, Haus & Garten',page:'118–131',unit:'6–10',level:'A1–A2',goals:['Über die Familie sprechen','Einen Tisch decken und Dinge zuordnen','Einen Garten oder ein Zuhause beschreiben','Zahlen bis 100 verwenden'],grammar:[['Unregelmäßige Substantive','Einige häufige Verwandtschafts- und Körperbezeichnungen bilden besondere Plural- oder Possessivformen. Diese Formen sollte man als eigene Wortformen lernen.','أب / أبي','ab / abī','Vater / mein Vater'],['Adjektiv nach bestimmtem Substantiv','Ist das Substantiv bestimmt, steht auch das nachfolgende attributive Adjektiv bestimmt. Das Adjektiv stimmt in Geschlecht und Zahl überein.','البيت الكبير','al-bayt al-kabīr','das große Haus'],['Präpositionen mit Personalendungen','An Präpositionen können Personalendungen treten: لي „für/mir“, له „für ihn“, معها „mit ihr“ (je nach Präposition).','مع أبي','maʿa abī','mit meinem Vater']],phrases:[['هذه عائلتي.','hādhihi ʿāʾilatī.','Das ist meine Familie.'],['هذا أبي وهذه أمي.','hādhā abī wa-hādhihi ummī.','Das ist mein Vater und das ist meine Mutter.'],['أخي يسكن في برلين.','aḫī yaskunu fī Berlīn.','Mein Bruder wohnt in Berlin.'],['البيت كبير والحديقة جميلة.','al-bayt kabīr wa-l-ḥadīqa jamīla.','Das Haus ist groß und der Garten ist schön.'],['عندنا ثلاثة أطفال.','ʿindanā thalāthatu aṭfāl.','Wir haben drei Kinder.']],vocab:[['Familie','عائلة','ʿāʾila'],['Vater','أب','ab'],['Mutter','أم','umm'],['Bruder','أخ','aḫ'],['Schwester','أخت','uḫt'],['Haus','بيت','bayt'],['Garten','حديقة','ḥadīqa']],culture:'Das Buch widmet eine Kulturseite Grüßen und Umgangsformen. Achte im Alltag auf Situation, Beziehung und Höflichkeit: passende Begrüßung und Anrede gehören zur kommunikativen Kompetenz.',quiz:[['Was bedeutet أبي؟',['mein Vater','mein Bruder','mein Haus'],0,'أبي = Vater + meine Possessivendung.'],['Welche Kombination ist bestimmt?',['بيت كبير','البيت الكبير','بيتي كبير'],1,'Bei attributiver Verbindung wird das Adjektiv ebenfalls bestimmt.']]},
{id:11,title:'Verkehr, Fahrpläne & Kleidung',page:'132–141',unit:'11–15',level:'A2',goals:['Über Verkehrsmittel sprechen','Abfahrts- und Ankunftszeiten erfragen','Ein Ticket kaufen','Uhrzeiten und Kleidungsstücke benennen'],grammar:[['Dual','Arabisch besitzt neben Singular und Plural einen Dual für genau zwei Personen oder Dinge. Pronomen und Verb-/Nominalformen haben dafür eigene Muster.','كتابان','kitābān','zwei Bücher (Nominativform)'],['Perfekt Singular','Das Perfekt beschreibt abgeschlossene Handlungen. Die Person wird häufig durch Endungen am Verb angezeigt. Beispiel mit كتب „schreiben“: كتبَ kataba (er schrieb), كتبتْ katabat (sie schrieb).','وصل القطار.','waṣala l-qiṭār.','Der Zug ist angekommen.'],['Modalverb „müssen“','Eine häufige Konstruktion für Notwendigkeit ist يجب أنْ + Imperfekt im Konjunktiv.','يجب أن أذهب.','yajibu an adh-haba.','Ich muss gehen.'],['Negativer Imperativ','Ein Verbot wird mit لا vor einer jussivischen Imperfektform ausgedrückt. Die Endung kann je nach Verbform sichtbar verändert werden.','لا تتأخر!','lā tataʾaḫḫar!','Komm nicht zu spät!'],['Verben mit و als schwachem Auslaut','Bei manchen Verben ist der dritte Wurzelkonsonant ein و. Der lange Vokal kann sich je nach Form und Endung verändern; lerne diese Verben mit ihren zentralen Formen.','دعا / يدعو','daʿā / yadʿū','rufen / einladen']],phrases:[['متى يصل القطار؟','matā yaṣilu l-qiṭār?','Wann kommt der Zug an?'],['أريد تذكرة إلى القاهرة.','urīdu tadhkira ilā l-qāhira.','Ich möchte ein Ticket nach Kairo.'],['كم الساعة؟','kam as-sāʿa?','Wie spät ist es?'],['يجب أن نذهب الآن.','yajibu an nadhhaba l-ān.','Wir müssen jetzt gehen.'],['لا تتأخر!','lā tataʾaḫḫar!','Komm nicht zu spät!']],vocab:[['Zug','قطار','qiṭār'],['Bus','حافلة','ḥāfila'],['Ticket','تذكرة','tadhkira'],['Bahnhof','محطة','maḥaṭṭa'],['Uhr / Stunde','ساعة','sāʿa'],['ankommen','وصل','waṣala'],['Kleidung','ملابس','malābis']],culture:'Die Kulturseite thematisiert Währungen der arabischen Welt. Bei Reise- und Kaufsituationen sind Zahlen, Währungsnamen und das Nachfragen nach Preisen besonders nützlich.',quiz:[['Was drückt يجب أن أذهب aus?',['Ich möchte gehen.','Ich muss gehen.','Ich bin gegangen.'],1,'يجب أن + Imperfekt im Konjunktiv drückt Notwendigkeit aus.'],['Was ist ein Dual?',['genau zwei','mehr als zehn','nur eine Person'],0,'Der Dual ist eine eigene grammatische Zahl für zwei.']]},
{id:12,title:'Wohnung, Wetter & Aktivitäten',page:'142–151',unit:'11–15',level:'A2',goals:['Eine Wohnung beschreiben und eine Postkarte schreiben','Über Wetter und Aktivitäten berichten','Erzählte Aussagen wiedergeben','Vergangenheit im Plural verwenden'],grammar:[['Verstärkungspartikel','Die Partikel إنّ verstärkt bzw. betont eine Aussage und beeinflusst die Kasusform des folgenden Nomens. Sie begegnet häufig in nachdrücklichen Feststellungen.','إنّ الطقس جميل.','inna ṭ-ṭaqsa jamīl.','Das Wetter ist wirklich schön.'],['Indirekte Rede / أنَّ','Aussagen können mit أنَّ („dass“) eingebettet werden. Nach bestimmten Verben steht außerdem أنْ + Konjunktiv, etwa nach „wollen“ oder „müssen“-Konstruktionen.','أعرف أن الطقس جميل.','aʿrifu anna ṭ-ṭaqsa jamīl.','Ich weiß, dass das Wetter schön ist.'],['Perfekt im Plural','Auch das Perfekt erhält Personenendungen. Beispiel كتبوا katabū „sie (m.) schrieben“; كتَبْنا katabnā „wir schrieben“.','زرنا الأصدقاء.','zurnā l-aṣdiqāʾ.','Wir haben die Freunde besucht.'],['Imperfekt im Konjunktiv','Nach bestimmten Partikeln wie أنْ steht der Konjunktiv. Bei vielen regelmäßigen Singularformen zeigt sich dies durch ein -a am Ende; bei den sogenannten fünf Verben entfällt das ن.','أريد أن أسافر.','urīdu an usāfira.','Ich möchte verreisen.'],['Nisba-Form im Plural','Die Nisba bildet Zugehörigkeitsadjektive. Die Grundformen enden häufig auf ـيّ (maskulin) und ـيّة (feminin); im Plural kommen u. a. ـيون / ـيين sowie ـيات vor.','مصر ← مصري ← مصريون','miṣr ← miṣrī ← miṣriyyūn','Ägypten → ägyptisch (m.) → Ägypter (m. Pl.)'],['Verben mit Hamza','Bei Verben mit Hamza als Wurzelkonsonant muss die Schreibweise der Hamza beachtet werden. Ihr Sitz kann von den umgebenden Vokalen abhängen; lerne die Formen als zusammengehörige Wortfamilie.','سأل / يسأل','saʾala / yasʾalu','fragen (Perfekt / Imperfekt)']],phrases:[['شقتي في الطابق الثالث.','šaqqatī fī ṭ-ṭābiqi th-thālith.','Meine Wohnung ist im dritten Stock.'],['الجو جميل اليوم.','al-jawwu jamīl al-yawm.','Das Wetter ist heute schön.'],['أكتب بطاقة بريدية.','aktubu biṭāqa barīdiyya.','Ich schreibe eine Postkarte.'],['كان الجو بارداً أمس.','kāna l-jawwu bāridan ams.','Gestern war das Wetter kalt.'],['زرنا المتحف.','zurnā l-matḥaf.','Wir haben das Museum besucht.']],vocab:[['Wohnung','شقة','šaqqa'],['Etage','طابق','ṭābiq'],['Wetter','طقس','ṭaqs'],['Sonne','شمس','šams'],['Regen','مطر','maṭar'],['Postkarte','بطاقة بريدية','biṭāqa barīdiyya'],['heute','اليوم','al-yawm']],culture:'Die Kulturseite stellt das arabische Haus vor. Beschreibungen von Räumen, Lage und Wetter sind gute Anlässe, Präpositionen und Adjektive in zusammenhängenden Sätzen zu verwenden.',quiz:[['Was bedeutet أريد أن أسافر؟',['Ich bin gereist.','Ich möchte verreisen.','Ich werde nicht reisen.'],1,'أريد أن + Konjunktiv bedeutet „ich möchte …“.'],['Welche Form bedeutet „wir besuchten“?',['زرنا','زاروا','أزور'],0,'زرنا = wir besuchten / haben besucht.']]},
{id:13,title:'Schule, Vergangenheit & Tagesablauf',page:'152–161',unit:'11–15',level:'A2',goals:['Über Schulzeit und Vergangenes berichten','Den eigenen Tagesablauf beschreiben','Einen Arbeitstag schildern','Zeitangaben und Verneinung anwenden'],grammar:[['Perfekt: Besonderheiten','Bei Verben mit schwachen Radikalen können sich Vokale und Stammformen verändern. Lerne diese Verben mit ihren wichtigen Formen, statt jede Form mechanisch aus einer regelmäßigen Vorlage abzuleiten.','كان / كنتُ','kāna / kuntu','er war / ich war'],['Verben mit Präpositionen','Einige Verben verbinden sich fest mit einer bestimmten Präposition. Diese Verbindung gehört zum Wortschatz: etwa أحتاج إلى „brauchen“, أبحث عن „suchen nach“.','أحتاج إلى وقت.','aḥtāju ilā waqt.','Ich brauche Zeit.'],['Jussiv / Apokopat','Der Jussiv wird nach bestimmten Partikeln verwendet, zum Beispiel لم. Bei vielen regelmäßigen Verben fällt der kurze Endvokal weg.','لم أعملْ أمس.','lam aʿmal ams.','Ich habe gestern nicht gearbeitet.'],['Zeitangaben','Wochentage und Tageszeiten stehen häufig mit passenden Präpositionen oder als Adverbialangaben. Für regelmäßige und punktuelle Handlungen werden unterschiedliche Zeitangaben gebraucht.','أستيقظ في الساعة السابعة.','astayqiẓu fī s-sāʿa s-sābiʿa.','Ich wache um sieben Uhr auf.']],phrases:[['درست في المدرسة.','darastu fī l-madrasa.','Ich habe in der Schule gelernt.'],['أستيقظ الساعة السابعة.','astayqiẓu s-sāʿa s-sābiʿa.','Ich wache um sieben Uhr auf.'],['ثم أذهب إلى العمل.','thumma adhhabu ilā l-ʿamal.','Dann gehe ich zur Arbeit.'],['ماذا فعلت أمس؟','mādhā faʿalta ams?','Was hast du gestern gemacht? (m.)'],['لم أعمل أمس.','lam aʿmal ams.','Ich habe gestern nicht gearbeitet.']],vocab:[['Schule','مدرسة','madrasa'],['Unterricht / Stunde','درس','dars'],['Tag','يوم','yawm'],['Morgen','صباح','ṣabāḥ'],['arbeiten','عمل','ʿamila'],['gehen','ذهب','dhahaba'],['gestern','أمس','ams']],culture:'Die Kulturseite greift Fremdwörter im Arabischen auf. Sprachkontakt zeigt sich in Lehnwörtern und modernen Fachbegriffen; ihre Aussprache und Schreibung können angepasst sein.',quiz:[['Wie wird eine Handlung mit لم verneint?',['لم + jussivisches Imperfekt','لن + Perfekt','لا + Nomen'],0,'لم verlangt den Jussiv und bezieht sich auf eine vergangene Verneinung.'],['Was bedeutet أمس؟',['morgen','gestern','heute'],1,'أمس = gestern.']]},
{id:14,title:'Personen, Mode & Lebensstile',page:'162–171',unit:'11–15',level:'A2',goals:['Personen äußerlich beschreiben','Über Mode und Lebensstile sprechen','Entwicklungen und frühere Zustände schildern','Farbadjektive einsetzen'],grammar:[['Vergangenheitsverlauf','Mit كان + Imperfekt kann ein andauernder oder gewohnheitsmäßiger Zustand in der Vergangenheit beschrieben werden. Die Form von كان passt sich dem Subjekt an.','كان يعمل في المدرسة.','kāna yaʿmalu fī l-madrasa.','Er arbeitete gerade / gewöhnlich in der Schule.'],['Das Verb كان','كان bedeutet „sein“ in der Vergangenheit und wird mit einem folgenden Satzteil oder Imperfekt verwendet. Im Präsens steht in einfachen nominalen Sätzen häufig kein eigenes „sein“.','كانت سعيدة.','kānat saʿīda.','Sie war glücklich.'],['Farbadjektive','Farben sind Adjektive und stimmen in Genus und Bestimmtheit mit dem Bezugswort überein. Einige Farben besitzen besondere feminine Formen.','قميص أزرق','qamīṣ azraq','ein blaues Hemd'],['Zeitraum und Jahrzehnte','Zeitangaben wie „in den achtziger Jahren“ verbinden Zahlen mit einer zeitlichen Einordnung. Achte auf die im Buch eingeführten Formen für Jahrzehnte.','في الثمانينيات','fī th-thamānīniyyāt','in den achtziger Jahren']],phrases:[['هو طويل.','huwa ṭawīl.','Er ist groß.'],['هي قصيرة.','hiya qaṣīra.','Sie ist klein.'],['له شعر أسود.','lahu šaʿr aswad.','Er hat schwarze Haare.'],['هي ترتدي فستاناً أزرق.','hiya tartadī fistānan azraq.','Sie trägt ein blaues Kleid.'],['كان يعمل في القاهرة.','kāna yaʿmalu fī l-qāhira.','Er arbeitete in Kairo.']],vocab:[['groß / lang','طويل','ṭawīl'],['klein / kurz','قصير','qaṣīr'],['Haare','شعر','šaʿr'],['Kleidung','ملابس','malābis'],['schwarz','أسود','aswad'],['weiß','أبيض','abyaḍ'],['blau','أزرق','azraq']],culture:'Die Kulturseite behandelt arabische Kleiderordnungen. Beschreibungen sollten sachlich und situationsbezogen bleiben: Kleidung ist individuell und unterscheidet sich je nach Person, Region und Anlass.',quiz:[['Wie bildest du eine Vergangenheitsbeschreibung?',['كان + Imperfekt','سوف + Perfekt','هل + Nomen'],0,'كان + Imperfekt beschreibt einen Zustand oder Verlauf in der Vergangenheit.'],['Was bedeutet شعر أسود؟',['weißes Hemd','schwarze Haare','blaues Kleid'],1,'شعر = Haare; أسود = schwarz.']]},
{id:15,title:'Urlaub, Hotel & Lebenslauf',page:'172–181',unit:'11–15',level:'A2',goals:['Eine Reise und einen Urlaub planen','Im Hotel einchecken und Informationen einholen','Über den Urlaubsort sprechen','Den eigenen Lebenslauf in Grundzügen schildern'],grammar:[['Imperativ','Der Imperativ richtet sich an eine angesprochene Person. Er wird aus dem Imperfektstamm gebildet; die Form hängt von Person, Genus und Zahl ab.','اكتب هنا.','uktub hunā.','Schreib hier. (m.)'],['„dass“ und Partikeln mit Konjunktiv','Nach Verben wie „wollen“ steht أنْ + Imperfekt im Konjunktiv. Bei wiedergegebener Aussage ist أنَّ eine wichtige Einleitung für „dass“.','أريد أن أحجز غرفة.','urīdu an aḥjiza ġurfa.','Ich möchte ein Zimmer reservieren.'],['Relativpronomen und Relativsätze','Das Relativpronomen richtet sich nach Genus und Zahl des Bezugsworts: الذي (m. Sg.), التي (f. Sg.), الذين (m. Pl.). Bei unbestimmtem Bezugswort kann das Relativpronomen entfallen.','الفندق الذي أسكن فيه','al-funduq alladhī askunu fīhi','das Hotel, in dem ich wohne'],['Ordinalzahlen und große Zahlen','Ordinalzahlen funktionieren als Adjektive und richten sich nach ihrem Bezugswort. Für Zahlen über 1000 werden größere Zahlwörter kombiniert.','هذه الغرفة الثانية.','hādhihi l-ġurfa ath-thāniya.','Das ist das zweite Zimmer.']],phrases:[['أريد حجز غرفة.','urīdu ḥajza ġurfa.','Ich möchte ein Zimmer reservieren.'],['هل لديكم غرفة متاحة؟','hal ladaykum ġurfa mutāḥa?','Haben Sie ein freies Zimmer?'],['أين يقع الفندق؟','ayna yaqaʿu l-funduq?','Wo liegt das Hotel?'],['أريد أن أعرف ...','urīdu an aʿrifa ...','Ich möchte wissen …'],['سافرت إلى مصر.','sāfartu ilā miṣr.','Ich bin nach Ägypten gereist.']],vocab:[['Urlaub','عطلة','ʿuṭla'],['Reise','سفر','safar'],['Hotel','فندق','funduq'],['Zimmer','غرفة','ġurfa'],['Reservierung','حجز','ḥajz'],['frei / verfügbar','متاح','mutāḥ'],['Lebenslauf','سيرة ذاتية','sīra dhātiyya']],culture:'Die Abschluss-Kulturseite zeigt arabische Wörter im Deutschen. Das ist ein guter Anlass, Lehnwörter bewusster wahrzunehmen und Gemeinsamkeiten nicht mit identischer Bedeutung oder Aussprache gleichzusetzen.',quiz:[['Welches Relativpronomen steht typischerweise bei einem femininen Singular?',['الذي','التي','الذين'],1,'التي ist die feminine Singularform.'],['Wie heißt „Ich möchte ein Zimmer reservieren“?',['أريد حجز غرفة','أين الفندق؟','سافرت إلى مصر'],0,'أريد حجز غرفة = ich möchte ein Zimmer reservieren.']]}
];

; verbindet nicht nach links.'],['ي','yāʾ','y / ī','يـ','ـيـ','ـي','ي','Konsonant y oder langer Vokal ī.']

const grammar=[
['Artikel & Bestimmtheit','Arabisch hat keinen unbestimmten Artikel. Der bestimmte Artikel ال steht vor dem Nomen. Ein Wort ist außerdem bestimmt, wenn es ein Eigenname ist, eine Possessivendung trägt oder das erste Glied einer Genitivverbindung bildet.','كتابٌ / الكتاب','kitābun / al-kitāb','ein Buch / das Buch','Der Artikel bleibt in allen Genera gleich. Bei Sonnenbuchstaben wird das l des Artikels in der Aussprache assimiliert: الشمس wird aš-šams gesprochen.'],
['Sonnen- und Mondbuchstaben','Bei Sonnenbuchstaben wird das l des Artikels nicht gesprochen und der folgende Konsonant verdoppelt. Bei Mondbuchstaben bleibt das l hörbar.','الشمس / القمر','aš-šams / al-qamar','die Sonne / der Mond','Sonnenbuchstaben: ت ث د ذ ر ز س ش ص ض ط ظ ل ن. Die übrigen Buchstaben sind Mondbuchstaben.'],
['Genus & Femininum','Es gibt Maskulinum und Femininum, aber kein grammatisches Neutrum. ة ist eine häufige, jedoch nicht ausnahmslose Kennzeichnung des Femininums.','طالب / طالبة','ṭālib / ṭāliba','Student / Studentin','Lerne das Genus mit jedem neuen Substantiv. Nicht jedes Wort auf ة ist automatisch ein Personenwort.'],
['Nominaler Satz','Im Präsens steht in einfachen nominalen Sätzen gewöhnlich kein eigenes Wort für „sein“. Das Prädikat folgt auf das Subjekt.','البيت كبير.','al-bayt kabīr.','Das Haus ist groß.','Das Adjektiv kann als Prädikat unbestimmt bleiben, während ein attributives Adjektiv dem Nomen folgt und in der Bestimmtheit übereinstimmt.'],
['Fälle','Das Lehrwerk unterscheidet Nominativ, Genitiv und Akkusativ. Der Nominativ steht unter anderem beim Subjekt, der Genitiv nach Präpositionen und im zweiten Glied der iḍāfa, der Akkusativ häufig beim direkten Objekt.','في البيت / رأيت البيت','fī l-bayt / raʾaytu l-bayt','im Haus / ich sah das Haus','Die Kasusendungen sind in der gesprochenen Sprache oft nicht hörbar. Das Buch verwendet für manche Formen eine vereinfachte Darstellung; orientiere dich an den jeweils eingeführten Tabellen.'],
['Genitivverbindung (iḍāfa)','Eine Zugehörigkeit wird häufig durch zwei direkt aufeinanderfolgende Substantive ausgedrückt. Das erste Glied trägt keinen Artikel; das zweite bestimmt die Verbindung und steht im Genitiv.','كتاب الطالب','kitābu ṭ-ṭālib','das Buch des Studenten','An das erste Glied tritt in der Regel weder ال noch Tanwin. Possessivendungen sind eine weitere Möglichkeit, Besitz auszudrücken.'],
['Adjektive','Das attributive Adjektiv steht normalerweise nach dem Substantiv. Es stimmt in Genus, Zahl und Bestimmtheit überein. Bei nichtmenschlichen Pluralen wird häufig ein feminines Singularadjektiv verwendet.','المدينة الكبيرة','al-madīna al-kabīra','die große Stadt','Substantiv und Adjektiv gemeinsam lernen; auf ة und den bestimmten Artikel achten.'],
['Personalpronomen','Die Formen unterscheiden Person, Genus und Zahl. In der Verbform ist das Subjekt häufig bereits enthalten, daher kann das Pronomen entfallen.','أنا، أنتَ، أنتِ، هو، هي، نحن','anā, anta, anti, huwa, hiya, naḥnu','ich, du (m.), du (f.), er, sie, wir','Weitere Formen: أنتما (ihr zwei), أنتم (ihr m./gemischt), أنتنّ (ihr f.), هما (die zwei), هم (sie m./gemischt), هنّ (sie f.).'],
['Possessiv- und Präpositionalsuffixe','Personalendungen werden direkt an Substantive oder Präpositionen angefügt. Die genaue Aussprache kann sich durch den Wortausgang verändern.','كتابي، كتابه، عندي، له','kitābī, kitābuhu, ʿindī, lahu','mein Buch, sein Buch, ich habe, für ihn','Häufige Suffixe: ـي mein; ـكَ dein (m.); ـكِ dein (f.); ـه sein; ـها ihr; ـنا unser; ـكم euer; ـهم ihr (Pl.).'],
['Demonstrativpronomen','هذا (maskulin) und هذه (feminin) sind grundlegende Formen für „dieser/diese“. Im Plural stehen u. a. هؤلاء für Personen.','هذا بيت. / هذه مدينة.','hādhā bayt / hādhihi madīna','Das ist ein Haus. / Das ist eine Stadt.','Weitere häufige Formen: هذان / هاتان (Dual), هؤلاء (Plural Personen), ذلك / تلك (jener / jene).'],
['Imperfekt / Präsens','Das Imperfekt bezeichnet Gegenwart, Gewohnheit oder je nach Partikel Zukunft bzw. andere modale Bedeutungen. Bei regelmäßigen Verben werden Person und Zahl durch Präfixe und Endungen markiert.','أكتب، تكتب، يكتب','aktubu, taktubu, yaktubu','ich schreibe, du/sie schreibt, er schreibt','Lerne das Verb mit der 3. Person Singular, der 1. Person Singular und einem Beispielsatz. Nicht alle Verben folgen derselben Vokalfolge.'],
['Perfekt','Das Perfekt beschreibt eine abgeschlossene Handlung. Die Person wird überwiegend durch Endungen am Verbstamm ausgedrückt.','كتبتُ، كتبتَ، كتبَ، كتبتْ','katabtu, katabta, kataba, katabat','ich schrieb, du (m.) schriebst, er schrieb, sie schrieb','Viele Verben mit schwachen Radikalen weisen Besonderheiten auf. Für sie sind eigene Lernkarten sinnvoll.'],
['Konjunktiv & Jussiv','Nach bestimmten Partikeln steht das Imperfekt im Konjunktiv oder Jussiv. Im regulären Singular ist der Konjunktiv oft an -a erkennbar; der Jussiv lässt häufig den Endvokal weg.','أن أكتبَ / لم أكتبْ','an aktuba / lam aktub','dass ich schreibe / ich schrieb nicht','Häufige Auslöser: أنْ, لن (Konjunktiv); لم, لا des Verbots (Jussiv). Bei den sogenannten fünf Verben ändern sich die Endungen besonders.'],
['Futur & Verneinung','Das Futur entsteht mit سـ oder سوف + Imperfekt. Verneinung hängt von der Zeit und Konstruktion ab: لا für Gegenwart/Verbote, لم + Jussiv für Vergangenes, لن + Konjunktiv für Zukünftiges; ليس verneint nominale Aussagen.','سوف أذهب / لم أذهب','sawfa adhhab / lam adhhab','ich werde gehen / ich bin nicht gegangen','Die Partikel bestimmen die Verbform. Lerne deshalb immer die ganze Struktur und nicht nur das einzelne Verneinungswort.'],
['Relativsätze','Relativpronomen richten sich nach Genus und Zahl des Bezugsworts: الذي (m. Sg.), التي (f. Sg.), اللذان / اللتان (Dual), الذين (m. Pl.). Bei unbestimmtem Bezugswort kann das Pronomen entfallen.','الكتاب الذي قرأته','al-kitāb alladhī qaraʾtuhu','das Buch, das ich gelesen habe','Relativsätze verbinden ein Nomen mit einer näheren Beschreibung. Achte auf die Form des Bezugsworts.'],
['Zahlen, Zeit & Ordinalzahlen','Zahlen haben je nach Bereich unterschiedliche Regeln. Besonders wichtig sind die Genus-Gegensätzlichkeit bei 3–10, die Formen für Zehner sowie die Ordinalzahlen als Adjektive.','ثلاثة كتب / الساعة الثانية','thalāthatu kutub / as-sāʿa ath-thāniya','drei Bücher / zwei Uhr','Für 3–10 steht das gezählte Nomen normalerweise im Plural; ab 11 gelten andere Regeln. Ordinalzahlen passen sich dem Bezugswort an.']
];

function renderAlphabet(){
  let selected=letters.find(l=>l[0]===alphabetSelected)||letters[0];
  const sunLetters=new Set(['ت','ث','د','ذ','ر','ز','س','ش','ص','ض','ط','ظ','ل','ن']);

  const joinsLeft=!nonJoiningLeft.has(selected[0]);

  return `<div class="eyebrow">Anhang · Phonetik und Alphabet · Kursbuch S. 10, 22–23</div>
  <h2 style="font-size:29px;margin:5px 0">Die arabische Schrift lesen lernen</h2>
  <p class="muted">Das arabische Alphabet hat 28 Grundbuchstaben und wird von rechts nach links geschrieben. Die Kennzeichnungen zeigen bereits in der Übersicht, ob ein Buchstabe ein Sonnen- oder Mondbuchstabe ist und ob er eine Verbindung zum folgenden Buchstaben links eingeht.</p>
  <div class="letter-detail alphabet-letter-detail">

  </div>
  <div class="alphabet-grid">${letters.map(l=>{const isSun=sunLetters.has(l[0]);const canJoin=!nonJoiningLeft.has(l[0]);return `<button class="letter ${l[0]===alphabetSelected?'selected':''}" data-letter="${l[0]}" aria-label="${esc(l[1])}, ${isSun?'Sonnenbuchstabe':'Mondbuchstabe'}, ${canJoin?'verbindet nach links':'verbindet nicht nach links'}"><span class="letter-symbols"><span class="letter-symbol ${isSun?'sun':'moon'}" title="${isSun?'Sonnenbuchstabe':'Mondbuchstabe'}">${isSun?'☀':'☾'}</span><span class="letter-symbol ${canJoin?'join':'no-join'}" title="${canJoin?'Verbindet mit dem folgenden Buchstaben links':'Verbindet nicht mit dem folgenden Buchstaben links'}"><span class="join-glyph">${canJoin?'⟵':'⊣'}</span></span></span><span class="glyph" lang="ar">${l[0]}</span><small>${esc(l[1])}</small><small>${esc(l[2])}</small></button>`;}).join('')}</div>
  <div class="alphabet-legend"><span class="letter-flag sun">Sonnenbuchstabe</span><span class="letter-flag moon">Mondbuchstabe</span><span class="letter-flag join">Verbindet nach links</span><span class="letter-flag no-join">Keine Verbindung links</span></div>
  <div class="section-head"><div><h3>Vokale und Aussprache</h3><p>Kurze Vokale, lange Vokale, Sukūn und Hamza – entsprechend der Lautlehre des Kursbuchs.</p></div></div>
  <div class="two-col">
    <div class="card"><h4>Kurze und lange Vokale</h4><div class="table-wrap vowel-table"><table><thead><tr><th>Kurzer Vokal</th><th>Zeichen</th><th>Langer Vokal</th><th>Geschriebenes Muster</th></tr></thead><tbody>
      <tr><td>a</td><td class="ar" lang="ar">ـَ</td><td>ā</td><td class="ar" lang="ar">ـَا</td></tr>
      <tr><td>i</td><td class="ar" lang="ar">ـِ</td><td>ī</td><td class="ar" lang="ar">ـِي</td></tr>
      <tr><td>u</td><td class="ar" lang="ar">ـُ</td><td>ū</td><td class="ar" lang="ar">ـُو</td></tr>
    </tbody></table></div>
    <p class="small muted">Ein langer Vokal besteht aus dem kurzen Vokalzeichen und dem passenden Dehnungsbuchstaben: Alif für ā, Yāʾ für ī und Wāw für ū. Er wird ungefähr doppelt so lange gesprochen wie der kurze Vokal. Kurze Vokalzeichen stehen in gewöhnlichen Alltagstexten meist nicht dabei.</p>
    <div class="grammar-card"><h4>Sukūn: kein Vokal</h4><p>Ein Konsonant ohne folgenden Vokal erhält ein Sukūn-Zeichen. Am Wortende wird es häufig weggelassen.</p><div class="vowel-example"><span class="ar" lang="ar">ـْ</span><strong>sukūn</strong><small>Beispiel: اِسْم · ism</small></div></div></div>
    <div class="info-box gold"><h4>Hamza am Wortanfang</h4><p>Hamza (ء) bezeichnet den Glottisschlag. Am Wortanfang steht sie laut Kursbuch auf oder unter einem Alif; das kurze Vokalzeichen wird zusätzlich geschrieben:</p>
      <div class="vowel-extra-grid">
        <div class="vowel-example"><span class="ar" lang="ar">أَ</span><strong>ʾa</strong><small>Hamza + fatḥa</small></div>
        <div class="vowel-example"><span class="ar" lang="ar">إِ</span><strong>ʾi</strong><small>Hamza + kasra</small></div>
        <div class="vowel-example"><span class="ar" lang="ar">أُ</span><strong>ʾu</strong><small>Hamza + ḍamma</small></div>
      </div>
      <p class="small">In der Umschrift wird ein Apostroph für Hamza verwendet, am Wortanfang wird er in der im Buch verwendeten Umschrift weggelassen.</p>
      <div class="divider" style="height:1px;background:#eadfc9;margin:13px 0"></div>
      <h4>Hamza mit langem Vokal · Vertiefung</h4><p>Die langen Anfangslaute kannst du ebenfalls unterscheiden. Das ā wird mit Alif-Madda geschrieben; ī und ū bestehen aus Hamza-Alif mit dem passenden Vokalzeichen plus Dehnungsbuchstabe.</p>
      <div class="vowel-extra-grid">
        <div class="vowel-example"><span class="ar" lang="ar">آ</span><strong>ʾā</strong><small>Alif mit Madda</small></div>
        <div class="vowel-example"><span class="ar" lang="ar">إِي</span><strong>ʾī</strong><small>Hamza + kasra + yāʾ</small></div>
        <div class="vowel-example"><span class="ar" lang="ar">أُو</span><strong>ʾū</strong><small>Hamza + ḍamma + wāw</small></div>
      </div>
      <p class="small">Wichtig: آ ist ein einzelnes Schriftzeichen (Alif mit Madda), nicht zwei getrennt geschriebene Hamzas.</p>
    </div>
  </div>
  <div class="grammar-card"><h4>Tanwīn: die drei doppelten Vokalzeichen</h4><p>Tanwīn ist keine Hamza. Es besteht aus einem verdoppelten Vokalzeichen und wird am Wortende mit einem zusätzlichen n-Laut gesprochen: -an, -in oder -un. Die Formen begegnen auch in Beispielen wie كِتَابٌ; hier sind sie zum Vergleichen zusammengefasst.</p>
    <div class="table-wrap vowel-table"><table><thead><tr><th>Name</th><th>Zeichen</th><th>Aussprache</th><th>Beispiel</th></tr></thead><tbody>
      <tr><td>fatḥatān</td><td class="ar" lang="ar">ـً</td><td>-an</td><td class="ar" lang="ar">كِتَابًا</td></tr>
      <tr><td>kasratān</td><td class="ar" lang="ar">ـٍ</td><td>-in</td><td class="ar" lang="ar">كِتَابٍ</td></tr>
      <tr><td>ḍammatān</td><td class="ar" lang="ar">ـٌ</td><td>-un</td><td class="ar" lang="ar">كِتَابٌ</td></tr>
    </tbody></table></div>
    <p class="small muted">Die Endungen -an, -in und -un sind kurze Vokal-N-Endungen, keine langen Vokale ā, ī oder ū. Bei fatḥatān wird häufig zusätzlich ein Alif geschrieben, wie in كِتَابًا.</p>
  </div>
  <div class="grammar-card"><h4>Shadda: Verdopplung eines Konsonanten</h4><p>Die Shadda (ّ) zeigt an, dass ein Konsonant doppelt bzw. länger gesprochen wird. Sie steht über dem betroffenen Buchstaben und kann mit einem kurzen Vokalzeichen kombiniert werden. Anders als Tanwīn fügt sie keinen n-Laut hinzu.</p><div class="vowel-example" style="max-width:260px"><span class="ar" lang="ar">مُدَرِّسٌ</span><strong>mudarrisun</strong><small>Die Shadda steht auf dem ر und zeigt das doppelte r an.</small></div></div>
  <div class="two-col"><div class="info-box gold"><h4>Wichtige Aussprachehinweise</h4><ul class="clean-list"><li><b>ḫ / خ:</b> rauer Reibelaut wie „ch“ in Bach, weiter hinten.</li><li><b>ḥ / ح:</b> stimmloser Rachenlaut.</li><li><b>ʿ / ع:</b> stimmhafter Rachenlaut.</li><li><b>ṣ, ḍ, ṭ, ẓ:</b> emphatische Laute mit gespannter Zungen-/Mundstellung.</li><li><b>š / ش:</b> wie „sch“.</li><li>Doppelkonsonanten werden hörbar länger gehalten.</li></ul></div>
  <div class="grammar-card"><h4>Weitere Schriftzeichen</h4><p>Hamza kann je nach Position und Vokalumgebung auf verschiedenen Trägern erscheinen. Lerne häufige Formen als Teil des Wortbildes:</p><div class="example"><div class="arabic" lang="ar">ء / أ / إ / ؤ / ئ / ة / ى</div><div class="translation">Hamza · Tāʾ marbūṭa · Alif maqṣūra</div></div></div></div>
  <div class="grammar-card"><h4>Betonung</h4><p>Das Kursbuch erläutert die Betonung über Silbenlänge: Lange Silben enthalten einen langen Vokal oder werden durch die Konsonantenstruktur geschlossen. Betont wird eine der letzten drei Silben; stehen dort mehrere lange Silben, ist häufig die letzte maßgeblich. Vorsilben wie و، ال، ب، ف werden bei der Regel nicht als eigene betonte Silbe behandelt.</p></div>`;
}
function renderGrammar(){return `<div class="eyebrow">Anhang · Grammatiküberblick · Kursbuch S. 188–206</div><h2 style="font-size:29px;margin:5px 0">Grammatik-Nachschlagewerk</h2><p class="muted">Die Einträge fassen die im Kurs eingeführten Strukturen in Lernsprache zusammen. Öffne einen Bereich, lies das Beispiel und verknüpfe ihn anschließend mit der passenden Lektion.</p><div class="searchbar"><input id="grammarSearch" placeholder="Grammatikthema suchen …" oninput="filterGrammar(this.value)"><button class="btn line" data-action="expand-grammar">Alle aufklappen</button></div><div id="grammarList" class="grammar-index">${grammar.map((g,i)=>`<details data-grammar="${esc(g[0].toLowerCase())}"><summary>${i+1}. ${esc(g[0])}</summary><p>${esc(g[1])}</p><div class="example"><div class="arabic" lang="ar">${esc(g[2])}</div><div class="translit">${esc(g[3])}</div><div class="translation">${esc(g[4])}</div></div><p><b>Hinweis:</b> ${esc(g[5])}</p></details>`).join('')}</div><div class="section-head"><div><h3>Personalpronomen im Überblick</h3><p>Grundformen nach Person, Genus und Zahl.</p></div></div><div class="table-wrap"><table><thead><tr><th>Deutsch</th><th>Arabisch</th><th>Umschrift</th></tr></thead><tbody>${[['ich','أنا','anā'],['du (m.)','أنتَ','anta'],['du (f.)','أنتِ','anti'],['er','هو','huwa'],['sie','هي','hiya'],['wir','نحن','naḥnu'],['ihr zwei','أنتما','antumā'],['ihr (m./gemischt)','أنتم','antum'],['ihr (f.)','أنتنّ','antunna'],['die zwei','هما','humā'],['sie (m./gemischt)','هم','hum'],['sie (f.)','هنّ','hunna']].map(r=>`<tr><td>${r[0]}</td><td class="ar" lang="ar">${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div><div class="section-head"><div><h3>Regelmäßiges Verb im Imperfekt und Perfekt</h3><p>Modellverb كَتَبَ „schreiben“ – die Vokalfolge anderer Verben kann abweichen.</p></div></div><div class="table-wrap"><table><thead><tr><th>Person</th><th>Imperfekt / Präsens</th><th>Perfekt</th><th>Umschrift (Imperfekt)</th></tr></thead><tbody>${[['أنا','أكتب','كتبتُ','aktubu'],['أنتَ','تكتب','كتبتَ','taktubu'],['أنتِ','تكتبين','كتبتِ','taktubīna'],['هو','يكتب','كتبَ','yaktubu'],['هي','تكتب','كتبتْ','taktubu'],['نحن','نكتب','كتبنا','naktubu'],['أنتما','تكتبان','كتبتما','taktubāni'],['هما (m.)','يكتبان','كتبا','yaktubāni'],['هما (f.)','تكتبان','كتبتا','taktubāni'],['أنتم','تكتبون','كتبتم','taktubūna'],['أنتنّ','تكتبن','كتبتنّ','taktubna'],['هم','يكتبون','كتبوا','yaktubūna'],['هنّ','يكتبن','كتبن','yaktubna']].map(r=>`<tr><td>${r[0]}</td><td class="ar" lang="ar">${r[1]}</td><td class="ar" lang="ar">${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div><div class="callout">Die Tabelle zeigt ein regelmäßiges Modellverb. Bei anderen Verben kann der innere Vokal anders sein. Im Buch werden außerdem Besonderheiten schwacher Verben sowie Verbformen mit Endungen und Partikeln schrittweise eingeführt.</div><div class="section-head"><div><h3>Zahlen im Kursverlauf</h3><p>Die Auswahl deckt 0–10 sowie die Zehner, 100 und 1000 ab.</p></div></div><div class="table-wrap"><table><thead><tr><th>Zahl</th><th>Arabisch</th><th>Umschrift</th></tr></thead><tbody>${numWords.map(n=>`<tr><td>${n[0]}</td><td class="ar" lang="ar">${n[1]}</td><td>${n[2]}</td></tr>`).join('')}</tbody></table></div><div class="callout">Wichtig zu Zahlen: Bei 3–10 wird die Zahl im klassischen Muster geschlechtlich entgegengesetzt zum gezählten Substantiv gebildet; das Substantiv steht normalerweise im Plural. Die aufgeführten Formen 11–19 zeigen die maskulinen Zählformen; vor femininen Substantiven ändern sich die Zahlteile, z. B. إحدى عشرة امرأة. Die Tabelle ist ein Lernüberblick, keine vollständige Deklinationstabelle für sämtliche Zahlkonstruktionen.</div><div class="section-head"><div><h3>Ordinalzahlen 1–10</h3><p>Ordinalzahlen sind Adjektive und passen sich ihrem Bezugswort an.</p></div></div><div class="table-wrap"><table><thead><tr><th>Deutsch</th><th>Maskulin</th><th>Feminin</th></tr></thead><tbody>${[['erste(r)','الأول','الأولى'],['zweite(r)','الثاني','الثانية'],['dritte(r)','الثالث','الثالثة'],['vierte(r)','الرابع','الرابعة'],['fünfte(r)','الخامس','الخامسة'],['sechste(r)','السادس','السادسة'],['siebte(r)','السابع','السابعة'],['achte(r)','الثامن','الثامنة'],['neunte(r)','التاسع','التاسعة'],['zehnte(r)','العاشر','العاشرة']].map(r=>`<tr><td>${r[0]}</td><td class="ar" lang="ar">${r[1]}</td><td class="ar" lang="ar">${r[2]}</td></tr>`).join('')}</tbody></table></div><div class="section-head"><div><h3>Wochentage und häufige Zeitangaben</h3><p>Ergänzung zum Anhang „Zeitangaben“ im Kursbuch.</p></div></div><div class="table-wrap"><table><thead><tr><th>Deutsch</th><th>Arabisch</th><th>Umschrift</th></tr></thead><tbody>${[['Samstag','السبت','as-sabt'],['Sonntag','الأحد','al-aḥad'],['Montag','الاثنين','al-ithnayn'],['Dienstag','الثلاثاء','ath-thulāthāʾ'],['Mittwoch','الأربعاء','al-arbiʿāʾ'],['Donnerstag','الخميس','al-ḫamīs'],['Freitag','الجمعة','al-jumʿa'],['heute','اليوم','al-yawm'],['gestern','أمس','ams'],['morgen','غداً','ġadan'],['morgens','صباحاً','ṣabāḥan'],['abends','مساءً','masāʾan'],['nachts','ليلاً','laylan']].map(r=>`<tr><td>${r[0]}</td><td class="ar" lang="ar">${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div><div class="footer-note">Der systematische Grammatikteil des Kursbuchs beginnt auf S. 188. Er behandelt u. a. Artikel, Bestimmtheit, Deklination, Geschlecht, Pronomen, Verben, Präpositionen, Partikeln, Relativsätze, Zahlen und Zeitangaben.</div>`}
function filterGrammar(v){let q=(v||'').toLowerCase();document.querySelectorAll('[data-grammar]').forEach(d=>{d.style.display=d.dataset.grammar.includes(q)||d.textContent.toLowerCase().includes(q)?'':'none';});}
function getBaseCards(){let arr=lessons.flatMap(l=>l.vocab.map((v,i)=>({id:`${l.id}-${i}`,lesson:l.id,de:v[0],ar:v[1],tr:v[2]})));return trainerFilter==='all'?arr:arr.filter(c=>c.lesson===Number(trainerFilter));}
function reshuffleTrainerDeck(cards=getBaseCards()){let ids=cards.map(c=>c.id);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}trainerShuffleIds=ids;}
function getCards(){let arr=getBaseCards();if(trainerOrder==='random'){const ids=trainerShuffleIds;const valid=ids.length===arr.length&&arr.every(c=>ids.includes(c.id));if(!valid)reshuffleTrainerDeck(arr);const byId=new Map(arr.map(c=>[c.id,c]));arr=trainerShuffleIds.map(id=>byId.get(id)).filter(Boolean);}return arr.filter(c=>{const status=getCardStatus(c.id);if(trainerScope==='open')return status==='new';if(trainerScope==='review')return status==='review';if(trainerScope==='open-review')return status==='new'||status==='review';return true;});}
function resetTrainerSession(){trainerSession={seen:new Set(),decisions:new Map(),total:0};}
function getCardStatus(id){if(state.known.includes(id))return 'known';if(state.review.includes(id))return 'review';return 'new';}
function renderTrainerStats(cards,queueCards=cards){const total=cards.length;const known=cards.filter(c=>getCardStatus(c.id)==='known').length;const review=cards.filter(c=>getCardStatus(c.id)==='review').length;const fresh=total-known-review;const assessed=known+review;const knownPct=total?Math.round(known/total*100):0;const reviewPct=total?Math.round(review/total*100):0;const freshPct=total?Math.round(fresh/total*100):0;const assessedPct=total?Math.round(assessed/total*100):0;const sessionDecisions=[...(trainerSession.decisions||new Map()).values()];const sessionKnown=sessionDecisions.filter(status=>status==='known').length;const sessionReview=sessionDecisions.filter(status=>status==='review').length;return `<div class="trainer-stats"><div class="trainer-stat mastered"><span>Sicher beherrscht</span><strong>${known}<small> / ${total}</small></strong><em>${knownPct}% des ausgewählten Wortschatzes</em></div><div class="trainer-stat repeat"><span>Noch falsch</span><strong>${review}<small> / ${total}</small></strong><em>${reviewPct}% des ausgewählten Wortschatzes</em></div><div class="trainer-stat fresh"><span>Noch offen</span><strong>${fresh}<small> / ${total}</small></strong><em>${freshPct}% des ausgewählten Wortschatzes</em></div><div class="trainer-stat assessed"><span>Bewertet</span><strong>${assessed}<small> / ${total}</small></strong><em>${assessedPct}% schon eingeschätzt</em></div></div><div class="trainer-progress-wrap"><div class="trainer-progress"><span class="known-segment" style="width:${total?known/total*100:0}%"></span><span class="review-segment" style="width:${total?review/total*100:0}%"></span></div><div class="trainer-progress-legend"><span><i class="dot known-dot"></i>${known} sicher</span><span><i class="dot review-dot"></i>${review} noch falsch</span><span><i class="dot fresh-dot"></i>${fresh} offen</span></div></div><div class="trainer-session"><b>Diese Runde</b><span>${trainerSession.seen.size} / ${trainerSession.total||queueCards.length} Karten angesehen (diese Runde)</span><span>${sessionKnown} als sicher bewertet</span><span>${sessionReview} als falsch markiert</span></div>`;}
function renderTrainer(){
  let allCards=getBaseCards();
  let cards=getCards();
  if(cards.length){trainerIndex=((trainerIndex%cards.length)+cards.length)%cards.length;}else{trainerIndex=0;}
  let c=cards.length?cards[trainerIndex]:null;
  if(!trainerSession.total)trainerSession.total=cards.length;
  if(c)trainerSession.seen.add(c.id);
  let status=c?getCardStatus(c.id):'new';
  let statusLabel=status==='known'?'✓ Sicher beherrscht':status==='review'?'↻ Noch falsch':'○ Offen';
  const emptyMessage=trainerScope==='open'?'Es gibt in dieser Auswahl keine offenen Wörter mehr.':trainerScope==='review'?'Es gibt in dieser Auswahl keine als falsch markierten Wörter.':trainerScope==='open-review'?'Es gibt in dieser Auswahl keine offenen oder falschen Wörter.':'Für diese Auswahl gibt es aktuell keine Karten.';
  const flashcardMarkup=c?`<div class="flashcard status-${status}" data-action="flip-card" role="button" tabindex="0" aria-label="Karte umdrehen">
    <div class="flashcard-top"><span class="tag">${trainerFlipped?'Arabisch':'Deutsch'} · Lektion ${c.lesson}</span><span class="status-chip status-chip-${status}">${statusLabel}</span></div>
    ${trainerFlipped?`<div class="arabic" lang="ar">${c.ar}</div><div class="translit">${esc(c.tr)}</div><div class="prompt" style="font-size:16px">${esc(c.de)}</div>`:`<div class="prompt">${esc(c.de)}</div><div class="hint">Klicken oder Leertaste drücken, um die Lösung zu sehen</div>`}
  </div>`:`<div class="flashcard flashcard-empty" aria-disabled="true">
    <div class="flashcard-top"><span class="tag">Karteikarten</span><span class="status-chip status-chip-empty">Keine Karte</span></div>
    <div class="empty-card-message"><strong>${emptyMessage}</strong></div>
  </div>`;
  const disabledAttr=c?'':'disabled aria-disabled="true"';
  return `<div class="eyebrow">Aktiv trainieren</div><h2 style="font-size:29px;margin:5px 0">Wortschatz-Karteikarten</h2>
  <div class="trainer-toolbar">
    <div class="trainer-filter"><label for="trainerSelect">Lernumfang</label><select id="trainerSelect" class="field"><option value="all" ${trainerFilter==='all'?'selected':''}>Alle Lektionen</option>${lessons.map(l=>`<option value="${l.id}" ${trainerFilter===String(l.id)?'selected':''}>Lektion ${l.id}: ${esc(l.title)}</option>`).join('')}</select></div>
    <div class="trainer-scope"><label for="trainerScope">Was möchtest du üben?</label><select id="trainerScope" class="field"><option value="all" ${trainerScope==='all'?'selected':''}>Alle Wörter</option><option value="open" ${trainerScope==='open'?'selected':''}>Nur offene Wörter</option><option value="review" ${trainerScope==='review'?'selected':''}>Nur falsche Wörter</option><option value="open-review" ${trainerScope==='open-review'?'selected':''}>Nur offene oder falsche Wörter</option></select></div>
    <div class="trainer-order-control"><span>Reihenfolge</span><div class="trainer-order-buttons"><button class="btn ${trainerOrder==='source'?'':'line'}" data-trainer-order="source" aria-pressed="${trainerOrder==='source'}">Vorgegeben</button><button class="btn ${trainerOrder==='random'?'':'line'}" data-trainer-order="random" aria-pressed="${trainerOrder==='random'}">Random</button><button class="btn line shuffle-again" data-action="shuffle-cards" ${trainerOrder!=='random'?'disabled':''} aria-disabled="${trainerOrder!=='random'}">Mischen ↻</button></div></div>
  </div>
  ${renderTrainerStats(allCards,cards)}
  <div class="trainer-meta"><span>${c?`Karte ${trainerIndex+1} von ${cards.length}`:`0 Karten im aktuellen Filter`}</span></div>
  ${flashcardMarkup}
  <div class="flash-actions"><button class="btn line" data-action="card-prev" ${disabledAttr}>← Vorherige Karte</button><button class="btn danger" data-action="card-review" ${disabledAttr}>↻ Noch falsch</button><button class="btn soft" data-action="card-known" ${disabledAttr}>✓ Gewusst</button><button class="btn line" data-action="card-next" ${disabledAttr}>Nächste Karte →</button></div>
  <div class="section-head"><div><h3>Wörter suchen</h3><p>Deutsch, Arabisch oder Umschrift eingeben.</p></div></div><div class="searchbar"><input id="vocabSearch" placeholder="z. B. Bahnhof, كتاب oder bayt …" value="${esc(vocabSearch)}"></div><div id="vocabResults" class="vocab-grid">${vocabSearch?renderVocabResults(vocabSearch):'<div class="empty" style="grid-column:1/-1">Gib einen Suchbegriff ein, um passende Wörter zu finden.</div>'}</div><div class="callout">Der Wortschatztrainer nutzt ausgewählte, eigens zusammengestellte Lernwörter aus den Themenfeldern der 15 Lektionen. Er ersetzt nicht die vollständigen Wortlisten und das alphabetische Glossar im Buch (ab S. 209 bzw. S. 238).</div>`;
}
function renderVocabResults(q){let rows=getCards().filter(c=>(c.de+' '+c.ar+' '+c.tr).toLowerCase().includes(q.toLowerCase()));if(!rows.length)return '<div class="empty" style="grid-column:1/-1">Kein Treffer. Prüfe die Schreibweise oder suche nach einem anderen Teil des Wortes.</div>';return rows.slice(0,30).map(c=>`<div class="vocab-mini"><div class="arabic" lang="ar">${c.ar}</div><strong>${esc(c.de)}</strong><small>${esc(c.tr)} · Lektion ${c.lesson}</small></div>`).join('')}
function renderTests(){let groups=[['1–5','Wiederholung 1 · Buch S. 74–77',1],['6–10','Wiederholung 2 · Buch S. 128–131',2],['11–15','Wiederholung 3 · Buch S. 182–187',3],['all','Gesamttest · alle 15 Lektionen',0]];let qs=getQuizQuestions();return `<div class="eyebrow">Selbstkontrolle</div><h2 style="font-size:29px;margin:5px 0">Wiederholung & Tests</h2><p class="muted">Das Kursbuch bündelt nach jeweils fünf Lektionen den Lernstoff in Wiederholungs- und Testeinheiten. Die folgenden Aufgaben sind neu formulierte Übungsfragen zu denselben Themenfeldern.</p><div class="pill-row">${groups.map(g=>`<button class="choice-pill ${quizGroup===g[0]?'active':''}" data-quiz-group="${g[0]}">${g[1]}</button>`).join('')}</div><div class="card" style="margin-top:14px"><div class="progress-row"><div style="flex:1"><b>${quizGroup==='all'?'Gesamtkurs':quizGroup==='1–5'?'Etappe 1':quizGroup==='6–10'?'Etappe 2':'Etappe 3'}</b><p class="small muted" style="margin:2px 0">${qs.length} Fragen · eine richtige Antwort je Frage</p></div><span class="tag">${Object.keys(quizAnswers).length}/${qs.length} beantwortet</span></div></div><div id="quizArea">${qs.map((q,i)=>`<div class="quiz-q" data-quiz-id="${q.id}"><h4>${i+1}. Lektion ${q.lesson} · ${esc(q.prompt)}</h4><div class="choice-list">${q.choices.map((c,j)=>`<button class="choice ${quizAnswers[q.id]===j?'selected':''} ${quizChecked&&j===q.correct?'correct':''} ${quizChecked&&quizAnswers[q.id]===j&&j!==q.correct?'wrong':''}" data-test-answer="${j}" data-test-id="${q.id}">${esc(c)}</button>`).join('')}</div>${quizChecked?`<div class="feedback">${quizAnswers[q.id]===q.correct?'Richtig. ':'Noch nicht richtig. '}${esc(q.why)}</div>`:''}</div>`).join('')}</div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn" data-action="grade-quiz">Test auswerten</button><button class="btn line" data-action="reset-quiz">Zurücksetzen</button></div>${quizChecked?`<div class="result"><div class="eyebrow">Dein Ergebnis</div><strong>${qs.filter(q=>quizAnswers[q.id]===q.correct).length} / ${qs.length}</strong><p class="small">${Math.round(qs.filter(q=>quizAnswers[q.id]===q.correct).length/qs.length*100)} % richtig. ${qs.every(q=>quizAnswers[q.id]===q.correct)?'Sehr gut – wiederhole den Abschnitt in ein paar Tagen.':'Lies die Erklärungen der nicht korrekt beantworteten Aufgaben und probiere den Test danach erneut.'}</p></div>`:''}<div class="callout">Die Aufgaben sind keine Abschrift der Buchtests. Sie prüfen ausgewählte Lernziele und dienen der Selbstkontrolle, nicht als offizielle Niveauprüfung.</div>`}
function getQuizQuestions(){if(quizGroup==='all')return allQuestions;if(quizGroup==='1–5')return allQuestions.filter(q=>q.lesson<=5);if(quizGroup==='6–10')return allQuestions.filter(q=>q.lesson>=6&&q.lesson<=10);return allQuestions.filter(q=>q.lesson>=11);}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-action="flip-card"]');if(!b)return;if(b.dataset.view){nav(b.dataset.view);return;}if(b.dataset.lesson){currentLesson=Number(b.dataset.lesson);state.lastLesson=currentLesson;save();lessonTab='overview';nav('lesson');return;}if(b.dataset.tab){lessonTab=b.dataset.tab;render();return;}if(b.dataset.letter){alphabetSelected=b.dataset.letter;render();return;}if(b.dataset.quizGroup){quizGroup=b.dataset.quizGroup;quizAnswers={};quizChecked=false;render();return;}if(b.dataset.trainerOrder){trainerOrder=b.dataset.trainerOrder;trainerIndex=0;trainerFlipped=false;trainerShuffleIds=[];if(trainerOrder==='random')reshuffleTrainerDeck();resetTrainerSession();render();return;}if(b.dataset.localAnswer!==undefined){let q=b.closest('.quiz-q');q.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');b.dataset.picked='1';return;}if(b.dataset.testAnswer!==undefined){quizAnswers[b.dataset.testId]=Number(b.dataset.testAnswer);quizChecked=false;render();return;}if(b.dataset.action){let a=b.dataset.action;if(a==='open-next'){let n=lessons.find(l=>!state.completed.includes(l.id))||lessons[14];currentLesson=n.id;lessonTab='overview';nav('lesson');}else if(a==='toggle-complete'){let id=Number(b.dataset.id);state.completed=state.completed.includes(id)?state.completed.filter(x=>x!==id):[...state.completed,id];save();render();}else if(a==='trainer-lesson'){trainerFilter=b.dataset.id;trainerIndex=0;trainerFlipped=false;trainerShuffleIds=[];if(trainerOrder==='random')reshuffleTrainerDeck();resetTrainerSession();nav('trainer');}else if(a==='save-note'){let id=Number(b.dataset.id);state.notes[id]=document.getElementById('lessonNote').value;save();document.getElementById('noteSaved').textContent='Gespeichert ✓';}else if(a==='check-lesson-quiz'){let l=lessons.find(x=>x.id===currentLesson),correct=0;l.quiz.forEach((q,i)=>{let box=document.querySelector(`[data-local-q="${i}"]`),sel=box.querySelector('.choice.selected');let fb=box.querySelector('.feedback');if(sel&&Number(sel.dataset.localAnswer)===q[2]){correct++;fb.textContent='Richtig. '+q[3];fb.style.color='#23704e';}else{fb.textContent='Nicht ganz. '+q[3];fb.style.color='#a34e45';}});document.getElementById('lessonScore').innerHTML=`<div class="result"><b>${correct} von ${l.quiz.length} richtig.</b></div>`;}else if(a==='reset-lesson-quiz'){document.querySelectorAll('[data-local-q]').forEach(q=>{q.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'));q.querySelector('.feedback').textContent='';});document.getElementById('lessonScore').innerHTML='';}else if(a==='flip-card'){let c=getCards()[trainerIndex];if(c)trainerSession.seen.add(c.id);trainerFlipped=!trainerFlipped;render();}else if(a==='card-prev'){let count=getCards().length;trainerIndex=(trainerIndex-1+count)%count;trainerFlipped=false;render();}else if(a==='card-next'){trainerIndex++;trainerFlipped=false;render();}else if(a==='card-known'||a==='card-review'){let c=getCards()[trainerIndex];if(c){trainerSession.seen.add(c.id);const nextStatus=a==='card-known'?'known':'review';trainerSession.decisions.set(c.id,nextStatus);if(nextStatus==='known'){state.known=[...new Set([...state.known,c.id])];state.review=state.review.filter(x=>x!==c.id);}else{state.review=[...new Set([...state.review,c.id])];state.known=state.known.filter(x=>x!==c.id);}save();const stillInQueue=getCards().some(item=>item.id===c.id);if(stillInQueue)trainerIndex++;trainerFlipped=false;render();}}else if(a==='shuffle-cards'&&trainerOrder==='random'){reshuffleTrainerDeck();trainerIndex=0;trainerFlipped=false;resetTrainerSession();render();}else if(a==='grade-quiz'){quizChecked=true;let qs=getQuizQuestions(),score=qs.filter(q=>quizAnswers[q.id]===q.correct).length;state.scores[quizGroup]={score,total:qs.length,date:new Date().toISOString()};save();render();}else if(a==='reset-quiz'){quizAnswers={};quizChecked=false;render();}else if(a==='expand-grammar'){document.querySelectorAll('#grammarList details').forEach(d=>d.open=true);}}
});
document.addEventListener('change',e=>{if(e.target.id==='trainerSelect'){trainerFilter=e.target.value;trainerIndex=0;trainerFlipped=false;trainerShuffleIds=[];if(trainerOrder==='random')reshuffleTrainerDeck();resetTrainerSession();render();}else if(e.target.id==='trainerScope'){trainerScope=e.target.value;trainerIndex=0;trainerFlipped=false;resetTrainerSession();render();}});
document.addEventListener('input',e=>{if(e.target.id==='vocabSearch'){vocabSearch=e.target.value;let box=document.getElementById('vocabResults');if(box)box.innerHTML=renderVocabResults(vocabSearch);}if(e.target.id==='grammarSearch')filterGrammar(e.target.value);});
document.getElementById('mobileMenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.addEventListener('keydown',e=>{const active=document.activeElement;const onFlashcard=!!active&&active.classList&&active.classList.contains('flashcard');const globalSpace=e.code==='Space'&&active.tagName!=='INPUT'&&active.tagName!=='TEXTAREA'&&active.tagName!=='SELECT'&&active.tagName!=='BUTTON';if(view==='trainer'&&(onFlashcard&&(e.code==='Space'||e.code==='Enter')||globalSpace)){e.preventDefault();let c=getCards()[trainerIndex];if(c)trainerSession.seen.add(c.id);trainerFlipped=!trainerFlipped;render();}});
render();
